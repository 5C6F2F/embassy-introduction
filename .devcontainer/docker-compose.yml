services:
  embassy-introduction:
    privileged: true
    tty: true
    build:
      dockerfile: ./Dockerfile
      context: .
    volumes:
      - type: bind
        source: ../
        target: /embassy-introduction
      - type: bind
        source: ~/.ssh
        target: /home/ubuntu/.ssh
      - type: bind
        source: /dev/
        target: /dev/
    command: [ "bash" ]
